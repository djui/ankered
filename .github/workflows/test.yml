name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          xcodebuild \
            -project AnkerPower.xcodeproj \
            -scheme AnkerPower \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            test
